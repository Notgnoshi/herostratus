[workspace]
resolver = "3"
members = [
    # The main library and application
    "herostratus",
    # Quine commit finder
    "herostratus-quine",
    # Test fixtures
    "herostratus-tests",
]
default-members = ["herostratus", "herostratus-tests", "herostratus-quine"]

[profile.bench]
debug = true

[workspace.package]
version = "1.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/Notgnoshi/herostratus"
rust-version = "1.96"
description = "**Herostratus** *n.* **1.** An ancient Greek known for seeking fame through crime and destruction. **2.** Also a Git repository achievements engine."

[workspace.dependencies]
assert_cmd = { version = "2.2.2", features = ["color"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
color-eyre = "0.6.5"
csv = "1.4"
ctor = "1.0.13"
deunicode = "1"
directories = "6.0.0"
eyre = "0.6.14"
gix = { version = "0.86.0", features = ["blob-diff", "blocking-network-client", "credentials", "excludes", "index", "mailmap", "revision", "tracing", "tree-editor", "blocking-http-transport-reqwest-rust-tls"] }
gungraun = "0.19.4"
indicatif = "0.18.6"
inventory = "0.3.24"
minijinja = "2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
rayon = "1.12"
rustrict = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
tempfile = "3.27.0"
thread_local = "1.1"
toml = "1.1.4"
tracing = "0.1.44"
tracing-chrome = "0.7"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"
